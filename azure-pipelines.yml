trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - .gitignore
      - CODE_OF_CONDUCT.md
      - LICENSE.md
      - README.md
      - README.zh-cn.md
      - NuGet.Config
      - .github/*

# PR always trigger build
pr:
  autoCancel: true

# add nf-tools repo to resources (for Azure Pipelines templates)
resources:
  repositories:
    - repository: templates
      type: github
      name: nanoframework/nf-tools
      endpoint: nanoframework

pool:
  vmImage: 'windows-latest'

variables:
  DOTNET_NOLOGO: true

steps:

# Keep history available for rebasing generated README updates.
- checkout: self
  fetchDepth: 0

- script: |
    git config --global user.email "nanoframework@outlook.com"
    git config --global user.name "nfbot"
    git config --global core.autocrlf true
  displayName: Setup git identity

- task: PowerShell@2
  displayName: Initialize NuGet cache directory
  continueOnError: true
  inputs:
    targetType: 'inline'
    script: |
      # No-build runs may not create the directory needed by the post-job cache save.
      New-Item -ItemType Directory -Force -Path "$(UserProfile)\.nuget\packages" | Out-Null

- task: Cache@2
  displayName: Cache NuGet packages
  condition: succeeded()
  continueOnError: true
  inputs:
    key: 'nuget | **/packages.config'
    path: $(UserProfile)\.nuget\packages

- task: InstallNanoMSBuildComponents@1
  displayName: Install nanoFramework MSBuild components
  inputs:
    GitHubToken: $(GitHubToken)

# only build solutions that were changed
- task: PowerShell@2
  displayName: Build solutions
  inputs:
    targetType: 'filePath'
    filePath: '$(System.DefaultWorkingDirectory)\.pipeline-assets\build-solutions.ps1'
    failOnStderr: true
  env:
    MY_GITHUBTOKEN: $(GitHubToken)

# Adjust the readmes
- task: DotNetCoreCLI@2
  displayName: Adjust READMEs
  condition: >-
    and(
      succeeded(),
      eq(variables['System.PullRequest.PullRequestId'], '')
    )
  inputs:
    command: custom
    custom: run
    projects: '**/device-listing.csproj'
    workingDirectory: 'Samples'

- task: PowerShell@2
  condition: >-
    and(
      succeeded(),
      eq(variables['System.PullRequest.PullRequestId'], '')
    )
  displayName: Push READMEs to GitHub
  continueOnError: true
  inputs:
    targetType: 'inline'
    workingDirectory: '$(Build.SourcesDirectory)'
    script: |
      git add -- README.md README.zh-cn.md
      if ($LASTEXITCODE -ne 0) { throw "Failed to stage READMEs." }

      git diff --cached --quiet -- README.md README.zh-cn.md
      if ($LASTEXITCODE -eq 0)
      {
        Write-Host "No README changes to publish."
        exit 0
      }
      if ($LASTEXITCODE -ne 1) { throw "Failed to check staged README changes." }

      git commit -m "Update READMEs" -m "***NO_CI***"
      if ($LASTEXITCODE -ne 0) { throw "Failed to commit READMEs." }

      # compute authorization header in format "AUTHORIZATION: basic 'encoded token'"
      # 'encoded token' is the Base64 of the string "nfbot:personal-token"
      $auth = "basic $([System.Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("nfbot:$(GitHubToken)")))"
      git -c http.extraheader="AUTHORIZATION: $auth" push origin "HEAD:$(Build.SourceBranchName)"
      if ($LASTEXITCODE -ne 0) { throw "Failed to fetch the README target branch." }

      Write-Host "Rebasing..."
      git rebase FETCH_HEAD
      if ($LASTEXITCODE -ne 0) { throw "Failed to rebase README updates." }

      Write-Host "Pushing READMEs to $env:BUILD_SOURCEBRANCH"
      git -c http.extraheader="AUTHORIZATION: $auth" push origin "HEAD:$env:BUILD_SOURCEBRANCH"
      if ($LASTEXITCODE -ne 0) { throw "Failed to push README updates." }
  env:
    GITHUB_TOKEN: $(GitHubToken)

# report error
- template: azure-pipelines-templates/discord-webhook-task.yml@templates  
  parameters:
    status: 'failure'
    webhookUrl: '$(DiscordWebhook)'
    message: ''
